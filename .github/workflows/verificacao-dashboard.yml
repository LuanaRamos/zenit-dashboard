name: Verificar dashboard Zenit
on:
  push:
    branches: [fix/metricas-meta-2026-11-16]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes unitários sem acesso real à Meta
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src/dashboard tests
      - name: Validar sintaxe
        run: python -m compileall -q src/dashboard tests
